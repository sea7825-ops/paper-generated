<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Methane sensing papers: how each system works</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"><style id="css">
:root{
  --paper:#EDF1F3;--surface:#FFFFFF;--ink:#17263A;--muted:#55657A;--rule:#C8D2DB;
  --laser:#C42F3B;--gas:#6A4BC4;--accent:#1D6E77;--mark:#FBF0CF;--flag:#8A5A00;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1621;--surface:#162130;--ink:#E3EAF1;--muted:#9AA9BA;--rule:#2A394C;
  --laser:#FF6C75;--gas:#A68DFF;--accent:#5EC4CD;--mark:#3A3320;--flag:#E8B65A;color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0E1621;--surface:#162130;--ink:#E3EAF1;--muted:#9AA9BA;--rule:#2A394C;
  --laser:#FF6C75;--gas:#A68DFF;--accent:#5EC4CD;--mark:#3A3320;--flag:#E8B65A;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
header.top{padding:56px 0 28px}
h1{font:400 clamp(2.2rem,5vw,3.6rem)/1.04 var(--serif);margin:0 0 16px;max-width:17ch;letter-spacing:-.01em}
.lede{max-width:62ch;color:var(--muted);margin:0}
h2{font:400 2rem/1.15 var(--serif);margin:0 0 6px}
h2+p{color:var(--muted);margin:0 0 22px;max-width:64ch}
section.block{padding:44px 0;border-top:1px solid var(--rule)}

/* encoding axis */
.axis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:8px}
.axis::before{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:linear-gradient(90deg,var(--laser),var(--gas))}
.stop{padding:0 14px 0 0}
.stop .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);margin:8px 0 14px;position:relative}
.stop h3{font:600 1rem/1.3 var(--sans);margin:0 0 4px}
.stop p{font-size:.88rem;color:var(--muted);margin:0 0 12px;max-width:26ch}
.chips{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{font-size:.85rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);padding:3px 10px;border-radius:999px}
.chip:hover,.chip:focus-visible{border-color:var(--ink)}
.chip.ours{background:var(--mark);border-color:var(--flag);color:var(--ink)}
@media (max-width:760px){
  .axis{grid-template-columns:1fr;gap:18px}
  .axis::before{left:6px;right:auto;top:0;bottom:0;width:2px;height:auto;background:linear-gradient(180deg,var(--laser),var(--gas))}
  .stop{padding-left:28px;position:relative}
  .stop .dot{position:absolute;left:0;top:-2px;margin:0}
}

/* units */
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.unit .glyph{font:400 3.1rem/1 var(--serif);color:var(--accent);margin-bottom:8px}
.unit h3{font:600 1rem var(--sans);margin:0 0 6px}
.unit p{margin:0 0 8px;font-size:.94rem}
.unit .eg{color:var(--muted);font-size:.88rem}
.callout{margin-top:28px;padding:16px 18px;border-left:3px solid var(--flag);background:var(--surface);max-width:78ch}
.callout p{margin:0 0 8px}.callout p:last-child{margin:0}
.formula{font:400 1.25rem var(--serif);white-space:nowrap}
@media (max-width:760px){.units{grid-template-columns:1fr}}

/* table */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
button{font:500 .9rem var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--ink);border-radius:6px;padding:7px 14px;cursor:pointer}
button.primary{background:var(--ink);color:var(--paper)}
button:focus-visible,[contenteditable]:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:.85rem;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:4px}
table{border-collapse:collapse;min-width:1560px;width:100%;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--rule)}
thead th{font-weight:600;background:var(--paper);position:sticky;top:0}
tbody th{font-weight:600;white-space:nowrap}
tbody th a{color:var(--ink)}
td[contenteditable]{white-space:pre-wrap;min-width:110px}
td[contenteditable]:hover{background:var(--paper)}
tr:last-child td,tr:last-child th{border-bottom:0}

/* patterns */
.patterns{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 36px}
.patterns h3{font:600 1rem var(--sans);margin:0 0 4px}
.patterns p{margin:0;font-size:.94rem;max-width:56ch}
.patterns .src{color:var(--muted);font-size:.84rem;margin-top:4px}
@media (max-width:760px){.patterns{grid-template-columns:1fr}}

/* papers */
.paper{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:34px;padding:38px 0;border-top:1px solid var(--rule)}
.plate{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px;align-self:start}
.plate h5{font:600 .86rem var(--sans);margin:18px 0 6px}.plate h5:first-child{margin-top:0}
.scandesc{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.plats{display:grid;gap:8px;margin-top:10px}
.plat{border:1px solid var(--rule);border-radius:4px;padding:8px 10px;background:var(--paper)}
.plat.has{border:1.5px solid var(--laser)}
.plat-h{font-weight:600;font-size:.88rem}
.tag{font-weight:500;font-size:.72rem;color:var(--laser);border:1px solid var(--laser);border-radius:999px;padding:0 7px;margin-left:4px;white-space:nowrap}
.plat ul{margin:6px 0 0;padding-left:18px;font-size:.84rem}
.plat li.s{font-weight:600;color:var(--laser)}
.flow{margin:6px 0 0;padding-left:22px;font-size:.85rem}
.plate svg{width:100%;height:auto;display:block}
.plate figcaption{font-size:.78rem;color:var(--muted);margin-top:6px}
.paper h3{font:400 1.75rem/1.15 var(--serif);margin:0 0 4px}
.cite{font-size:.88rem;color:var(--muted);margin:0 0 16px}
.paper h4{font:600 .95rem var(--sans);margin:20px 0 6px}
.paper [contenteditable]{white-space:pre-wrap;border-radius:3px}
.paper [contenteditable]:hover{background:var(--surface)}
.how{margin:0;max-width:62ch}
dl.nums{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:16px 0 0;font-size:.9rem;max-width:62ch}
dl.nums dt{color:var(--muted)}dl.nums dd{margin:0;font-weight:500}
.rel{margin:0;max-width:62ch;padding:12px 14px;background:var(--mark);border-radius:3px}
.notes{min-height:3.2em;padding:10px 12px;border:1px dashed var(--rule);border-radius:3px;max-width:62ch;background:var(--surface)}
.notes:empty::before{content:attr(data-placeholder);color:var(--muted)}
.flag{font-size:.85rem;color:var(--flag);margin:14px 0 0}
@media (max-width:860px){.paper{grid-template-columns:1fr}}

/* svg figures */
.fig .box{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.fig .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.fig .thin{stroke:var(--muted);stroke-width:1;fill:none}
.fig .dots{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:2 4}
.fig .ink{fill:var(--ink)}
.fig .laser{stroke:var(--laser);stroke-width:2;fill:none}
.fig .ret{stroke:var(--laser);stroke-width:1.3;stroke-dasharray:5 3;fill:none;opacity:.75}
.fig g.gas{opacity:.32}.fig g.gas circle,.fig .gasfill{fill:var(--gas)}
.fig .target{fill:var(--rule);stroke:var(--muted);stroke-width:1}
.fig .lbl{font:11px var(--sans);fill:var(--muted)}
.fig .led{fill:var(--laser)}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
.savebar.on{display:block}
.savebar .in{max-width:1120px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.savebar span{flex:1;min-width:200px;font-size:.92rem}
.savebar button{border-color:var(--paper);background:transparent;color:var(--paper)}
.savebar button.primary{background:var(--paper);color:var(--ink)}
.status{font-size:.85rem;color:var(--muted);min-height:1.3em}
footer{padding:30px 0 80px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--rule)}

 else if(type==='rose'){b='<circle class="box" cx="150" cy="74" r="56"/><path class="laser" d="'+rose(150,74,50)+'" stroke-width="1.3"/><text class="lbl" x="214" y="40">beam path on the target</text><text class="lbl" x="214" y="56">(wedges rotate;</text><text class="lbl" x="214" y="70">sensor head fixed)</text>';}

function unitsHTML(){return '<section class="block" id="units"><h2>Three numbers that sound alike</h2><p>Every paper reports at least one of these, and they answer different questions.</p><div class="units">'+
'<div class="unit"><div class="glyph">ppm</div><h3>Concentration at one point</h3><p>How much methane is in the air right where a probe sits. Handheld detectors and EPA Method 21 use it; leak definitions are often 500 ppm.</p><p class="eg">Says nothing about how big the leak is.</p></div>'+

'<div class="unit"><div class="glyph">g/h</div><h3>Emission rate</h3><p>How much methane leaves the source per unit time. This is what "how big" means. 1 L/min ≈ 0.011 g/s ≈ 40 g/h.</p><p class="eg">DOI orphaned-well guidelines require detecting 1 g/h.</p></div></div>'+

['Control the background','A remote absorption reading mixes methane with background brightness. Gibson switches the laser on and off the absorption line; Wang X. locks the wavelength with a reference cell and images against a white screen.','Gibson 2017; Wang X. 2026'],

function render(){
 document.getElementById('app').innerHTML='<div class="wrap"><header class="top"><h1>How each system turns laser light into a picture of methane</h1><p class="lede">Nine papers behind our single-pixel methane sensor, sorted by how they get spatial information from a single measurement. Text in the table, the explanations and the notes is editable.</p><p class="status" id="status">'+esc(localNote)+'</p>'+axisHTML()+'</header>'+unitsHTML()+tableHTML()+patternsHTML()+
 '<section class="block" id="papers"><h2>Each system up close</h2><p>Sketch, how it works, key numbers, and what it means for our sensor.</p>'+state.papers.map(paperHTML).join('')+'</section>'+
 '<footer>Scan paths and hardware lists are simplified from each paper\'s text, not reproductions of the papers\' figures. Items marked for checking come from abstracts or other papers\' summaries.</footer></div>'+
 '<div class="savebar" id="savebar" role="region" aria-label="Unsaved edits"><div class="in"><span id="saveMsg">You have unsaved edits.</span><button type="button" id="discard">Discard</button><button type="button" class="primary" id="save">Save changes</button></div></div>';
 bind();}

function setStatus(t){var s=document.getElementById('status');if(s)s.textContent=t;}
function setDirty(v){dirty=v;var b=document.getElementById('savebar');if(b)b.classList.toggle('on',v);
 var m=document.getElementById('saveMsg');if(m)m.textContent=artifactNs?'You have unsaved edits. Saving updates this page for everyone who can open it.':'You have unsaved edits. They will be saved in this browser only.';}

function tsv(){var clean=function(s){return String(s||'').replace(/[\t\r\n]+/g,' ');};
 var lines=[['Paper'].concat(COLS.map(function(c){return c[1];})).join('\t')];
 state.papers.forEach(function(p){lines.push([p.short].concat(COLS.map(function(c){return clean(p[c[0]]);})).join('\t'));});return lines.join('\n');}

function buildDoc(){var css=document.getElementById('css').textContent,js=document.getElementById('main').textContent;
 var json=JSON.stringify(state).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n<html lang="en">\n<head>'+HEAD+'<style id="css">'+css+'</style></head><body><div id="app"></div><script type="application/json" id="state">'+json+'</scr'+'ipt><script id="main">'+js+'</scr'+'ipt></body></html>';}

function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){return false;}}

function bind(){
 document.getElementById('copyTsv').addEventListener('click',function(){var t=tsv(),msg=document.getElementById('copyMsg');
  var done=function(){msg.textContent='Copied. Paste into a spreadsheet first, then into your slide.';};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback(t);done();});}else{fallback(t);done();}});
 document.getElementById('save').addEventListener('click',save);
 document.getElementById('discard').addEventListener('click',function(){state=JSON.parse(saved);setDirty(false);render();setStatus('Edits discarded.');});
}
function fallback(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}

function save(){state.savedAt=Date.now();var btn=document.getElementById('save');
 if(artifactNs){btn.disabled=true;document.getElementById('saveMsg').textContent='Saving…';
  artifactNs.publish(buildDoc()).then(function(){saved=JSON.stringify(state);setDirty(false);setStatus('Saved.');},function(err){btn.disabled=false;var code=err&&err.code;
   if(code==='conflict'){setStatus('Someone saved a newer version first; the page is reloading to it.');}
   else{var ok=saveLocal();setDirty(false);setStatus(code==='not_granted'||code==='not_writer'?'This page is view-only for you. '+(ok?'Your edits were saved in this browser instead.':''):'Could not save to the page'+(code?' ('+code+')':'')+'. '+(ok?'Your edits were saved in this browser instead.':''));}});}
 else{var ok=saveLocal();saved=JSON.stringify(state);setDirty(false);setStatus(ok?'Saved in this browser.':'Could not save: browser storage is unavailable here.');}}

document.addEventListener('input',function(e){var t=e.target.closest&&e.target.closest('[data-field]');if(!t)return;
 var p=state.papers.filter(function(x){return x.id===t.dataset.pid;})[0];if(!p)return;p[t.dataset.field]=t.innerText.replace(/\n+$/,'');setDirty(true);});
document.addEventListener('paste',function(e){var t=e.target.closest&&e.target.closest('[contenteditable]');if(!t)return;e.preventDefault();
 var text=(e.clipboardData||window.clipboardData).getData('text/plain');try{document.execCommand('insertText',false,text);}catch(err){}});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});

render();
if(window.claude&&typeof window.claude.use==='function'){window.claude.use('artifact').then(function(ns){artifactNs=ns||null;if(dirty)setDirty(true);},function(){});}
})();
</script></body></html>
